<style>
/* v4: map tour. One screen: the floor plan is the navigation, the card shows the place. No walk animations, no input locks. */
:root{
  --black:#000;--white:#fff;--red:#ff0000;--ink-2:rgba(255,255,255,.72);--line:rgba(255,255,255,.16);--panel:#0d0d0d;
  --display:'Big Shoulders Display',Impact,'Arial Narrow Bold',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --gutter:clamp(14px,2.4vw,28px);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:900;line-height:.92;margin:0;text-transform:uppercase}
p{margin:0}a{color:inherit}ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:background-color 120ms ease,transform 120ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff}.btn-glass{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px var(--line)}
@media (hover:hover){.btn-red:hover{background:#e00000}.btn-glass:hover{background:rgba(255,255,255,.18)}}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) var(--gutter) 10px;background:var(--black);border-bottom:1px solid var(--line)}
.top .logo{display:block;width:64px;height:32px;--logo-ink:#fff;flex:none}.top .logo svg{width:100%;height:100%;display:block}
.top .book{display:flex;gap:8px;margin-left:auto;overflow-x:auto;scrollbar-width:none}.top .book::-webkit-scrollbar{display:none}
.top .book .btn{min-height:40px;font-size:16px;padding:0 14px;flex:none}
.menu-btn{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
@media (hover:hover){.menu-btn:hover{background:rgba(255,255,255,.1)}}
@media (max-width:700px){.top .book{display:none}}

/* layout: map left, card right */
.tour{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);gap:var(--gutter);padding:var(--gutter);min-height:calc(100svh - 61px)}
@media (max-width:900px){.tour{grid-template-columns:1fr}}

/* map */
.mapcol{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;min-width:0}
.maphead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.maphead h1{font-size:clamp(34px,4.4vw,60px)}
.maphead p{color:var(--ink-2);font-size:15px;margin-top:4px}
.viewtog{display:inline-flex;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);overflow:hidden;flex:none}
.viewtog button{min-height:40px;padding:6px 16px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.viewtog button[aria-pressed="true"]{background:#fff;color:#000}
.planbox{display:grid;place-items:center;min-height:0;perspective:1600px;padding:8px 0}
.planbox svg{width:100%;max-width:980px;height:auto;max-height:calc(100svh - 360px);transform-origin:50% 55%;transition:transform 600ms var(--ease-out)}
.planbox.is3d svg{transform:rotateX(46deg) rotateZ(-16deg) scale(.98)}
@media (max-width:900px){.planbox svg{max-height:none}}

/* places: every stop, one tap away */
.places{display:grid;gap:8px}
.places h2{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.5)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 13px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;transition:background-color 120ms ease}
.chip[aria-current="true"]{background:var(--red);box-shadow:none}
@media (hover:hover){.chip:not([aria-current="true"]):hover{background:rgba(255,255,255,.12)}}

/* plan drawing */
.plan .shell{fill:none;stroke:#fff;stroke-width:3}
.plan .room{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.7);stroke-width:1.5}
.plan .court{fill:#c8742f;stroke:#fff;stroke-width:1.3}
.plan .net{stroke:#fff;stroke-width:3}.plan .post{fill:#fff}
.plan .attack{stroke:rgba(255,255,255,.75);stroke-width:1;stroke-dasharray:4 3}
.plan text{fill:#fff;font-family:var(--body);font-weight:600;font-size:13px;pointer-events:none;text-anchor:middle}
.plan .znum{font-family:var(--display);font-weight:900;font-size:36px;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:5}
.plan .hit{fill:transparent;cursor:pointer}
.plan .zbox{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.45);stroke-width:1.2}
.plan .lot,.plan .door{fill:rgba(255,255,255,.18)}.plan .arrow{fill:none;stroke:var(--red);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.plan .lbl-s{font-size:11px;font-weight:500}.plan .zdesc{font-size:12.5px;font-weight:500;fill:rgba(255,255,255,.9);paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:3}
.plan g[data-area]:focus-visible{outline:none}.plan g[data-area]:focus-visible .zbox,.plan g[data-area]:focus-visible .room{stroke:var(--red);stroke-width:3}
.plan g[data-area].on .zbox{stroke:var(--red);stroke-width:3}
.plan g[data-area].on .court{fill:var(--red)}
.plan g[data-area].on .room{fill:rgba(255,0,0,.6);stroke:#fff}
@media (hover:hover){.plan g[data-area]:hover .court{fill:#e8893a}.plan g[data-area]:hover .room{fill:rgba(255,255,255,.2)}}
.plan .aisle{display:none}

/* card */
.card{align-self:start;position:sticky;top:calc(61px + var(--gutter));max-height:calc(100svh - 61px - 2 * var(--gutter));overflow:auto;overscroll-behavior:contain;display:block;background:var(--panel);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;scroll-margin-top:70px}
@media (max-width:900px){.card{position:static;max-height:none;overflow:visible;order:-1}}
.photo{position:relative;aspect-ratio:16/10;background:#111;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 180ms ease}
.photo img.loading{opacity:.35}
/* the moving photo on the welcome card: the panorama slides inside the card (small box, GPU transform) */
.photo img.pano{width:auto;max-width:none;height:100%;animation:look 30s ease-in-out infinite alternate}
@keyframes look{from{transform:translateX(0)}to{transform:translateX(calc(-100% + var(--cw,440px)))}}
.photo .num{position:absolute;left:14px;top:12px;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:var(--red);padding:3px 9px 4px;border-radius:6px}
.body{padding:18px 20px 20px;display:grid;gap:12px}
.body .kicker{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--red)}
.body h2{font-size:clamp(38px,4vw,54px)}
.body .courts{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.body .blurb{color:rgba(255,255,255,.88)}
.body .where{font-size:15px;color:var(--ink-2)}
.body h3{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.5)}
.body ul.what{display:grid;gap:5px}
.body ul.what li{padding-left:18px;position:relative}
.body ul.what li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;background:var(--red);transform:rotate(45deg)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.step{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.step button{min-height:44px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.08);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;text-align:left}
.step button:last-child{text-align:right}
.step button small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.55)}
@media (hover:hover){.step button:hover{background:rgba(255,255,255,.16)}}
.step button[hidden]{display:block;visibility:hidden}

/* dialogs: menu and info panel */
dialog{color:#fff;border:0;padding:0;max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:var(--gutter);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:26px;line-height:1;background:rgba(255,255,255,.1);z-index:2}
#menu,#panel{position:fixed;inset:0;left:auto;width:min(560px,100vw);height:100%;margin:0;background:#0a0a0a;transform:translateX(100%);transition:transform 280ms var(--ease-drawer),display 280ms allow-discrete,overlay 280ms allow-discrete}
#menu[open],#panel[open]{transform:none}
@starting-style{#menu[open],#panel[open]{transform:translateX(100%)}}
#menu .inner,#panel .inner{height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) var(--gutter) 40px}
#menu h2{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.5);margin:22px 0 8px}
#menu .row{display:flex;flex-wrap:wrap;gap:8px}
#menu .foot{margin-top:28px;color:var(--ink-2);font-size:15px;line-height:1.6}#menu .foot a{color:#fff;font-weight:600;text-decoration:none}
#panel .kicker{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--red);margin-top:6px}
#panel h2{font-size:clamp(40px,5vw,64px);margin-bottom:12px;padding-right:56px}
#panel .lede{color:rgba(255,255,255,.8);max-width:60ch;margin-bottom:22px}
#panel h3{font-size:24px;margin:22px 0 8px}
#panel ul.rules li{position:relative;padding:8px 0 8px 20px;border-top:1px solid rgba(255,255,255,.1);max-width:62ch}
#panel ul.rules li::before{content:"";position:absolute;left:0;top:1.05em;width:8px;height:8px;background:var(--red);transform:rotate(45deg)}
#panel details{border-top:1px solid rgba(255,255,255,.12)}
#panel summary{cursor:pointer;padding:14px 0;font-weight:600;font-size:17px}
#panel details p{padding:0 0 16px;max-width:60ch;color:rgba(255,255,255,.8)}
#panel .plist a,#panel .plist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;width:100%;text-align:left;padding:12px 0;border-top:1px solid rgba(255,255,255,.12);text-decoration:none}
#panel .plist strong{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase}
#panel .plist span{grid-column:1;color:var(--ink-2);font-size:15px}
#panel .plist i{grid-row:1/3;font-style:normal;font-family:var(--display);font-weight:700;text-transform:uppercase;color:var(--red)}
#panel .note{font-size:14px;color:rgba(255,255,255,.55);margin-top:24px}
form{display:grid;gap:14px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
input,select,textarea{font:inherit;color:#fff;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.3);border-radius:8px;padding:11px 13px;min-height:46px;width:100%}
select option{color:#000}textarea{min-height:120px;resize:vertical}
#form-note{color:var(--ink-2);font-size:14px}
@media (max-width:560px){.f2{grid-template-columns:1fr}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.photo img.pano{animation:none}}
</style>
</head>

const narrow=()=>matchMedia('(max-width: 900px)').matches;
const cardbody=$('#cardbody'),photo=$('#photo'),card=$('#card');

let D;
try{const r=await fetch('data/zones.json');if(!r.ok)throw 0;D=await r.json();}
catch(e){cardbody.innerHTML='<p class="blurb">The building data did not load. Refresh, or call 720-773-4776.</p>';return;}

const area=id=>D.areas.find(a=>a.id===id);
const partner=id=>D.partners.find(p=>p.id===id);
const inquiry=id=>D.inquiries.find(i=>i.id===id)||D.inquiries[D.inquiries.length-1];
const isUrl=u=>/^https?:/.test(u||'');
/* one tour order: courts by zone number, then the rooms. Same order as the place list, so Next always means the next chip. */
const courts=D.areas.filter(a=>a.zone).sort((a,b)=>a.zone-b.zone), rooms=D.areas.filter(a=>!a.zone);
const ORDER=[...courts,...rooms].map(a=>a.id);

/* ---------- map + place list ---------- */
const planbox=$('#planbox');
planbox.innerHTML=FHPLAN.svg({areas:D.areas,you:false});
if(narrow())setView('flat');
function setView(v){planbox.classList.toggle('is3d',v==='3d');$$('.viewtog button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));}
$$('.viewtog button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
const chip=a=>`<button class="chip" data-go="${esc(a.id)}">${esc(a.name)}</button>`;
$('#places').innerHTML=`<h2>COURTS</h2><div class="chips">${courts.map(chip).join('')}</div><h2>ROOMS</h2><div class="chips">${rooms.map(chip).join('')}</div>`;

/* ---------- the card ---------- */
let token=0;
function setPhoto(src,pano){
  const t=++token;photo.classList.add('loading');
  const im=new Image();im.src=src;
  const show=()=>{if(t!==token)return;photo.src=src;photo.classList.toggle('pano',!!pano);photo.classList.remove('loading');};
  (im.decode?im.decode():Promise.resolve()).then(show,show);
}
function ctaFor(p,a){
  if(p&&isUrl(p.url))return `<a class="btn btn-red" href="${esc(p.url)}" rel="noopener">${esc(p.name)}</a>`;
  return `<button class="btn btn-red" data-open="contact" data-inquiry="${esc(a.inquiry)}">Ask the front desk</button>`;
}
function stepBtns(i){
  const p=ORDER[i-1],n=ORDER[i+1];
  return `<div class="step"><button data-go="${p||''}" ${p?'':'hidden'} aria-label="${p?'Previous: '+esc(area(p).name):''}"><small>← PREVIOUS</small>${p?esc(area(p).name):''}</button><button data-go="${n||''}" ${n?'':'hidden'} aria-label="${n?'Next: '+esc(area(n).name):''}"><small>NEXT →</small>${n?esc(area(n).name):''}</button></div>`;
}
function showWelcome(){
  setPhoto(D.lobby.img,D.lobby.pano);
  photo.alt='Inside the field house: the courts from the main entrance';
  cardbody.innerHTML=`<p class="kicker">${esc(D.exterior.kicker)}</p><h2>${esc(D.exterior.title)}</h2><p class="blurb">${esc(D.exterior.lede)}</p>
    <div class="acts"><button class="btn btn-red" data-go="${ORDER[0]}">Start the tour →</button><a class="btn btn-glass" href="site.html">Full site</a></div>`;
}
function showArea(a){
  const p=partner(a.partner),i=ORDER.indexOf(a.id);
  setPhoto(a.img,false);photo.alt=a.name;
  const sec=a.secondary?(a.secondary.url?`<a class="btn btn-glass" href="${esc(a.secondary.url)}" rel="noopener">${esc(a.secondary.label)}</a>`:`<button class="btn btn-glass" data-open="contact" data-inquiry="${esc(a.secondary.inquiry||a.inquiry)}">${esc(a.secondary.label)}</button>`):'';
  const ask=p&&isUrl(p.url)?`<button class="btn btn-glass" data-open="contact" data-inquiry="${esc(a.inquiry)}">Ask the front desk</button>`:'';
  cardbody.innerHTML=`<p class="kicker">${esc(a.tag)} · ${i+1} of ${ORDER.length}</p><h2>${esc(a.name)}</h2>${a.courts?`<p class="courts">${esc(a.courts)}</p>`:''}
    <p class="blurb">${esc(a.blurb)}</p>${a.where?`<p class="where">${esc(a.where)}</p>`:''}
    <h3>WHAT'S HERE</h3><ul class="what">${a.what.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${p&&p.id!=='fhusa'?`<h3>WHO RUNS IT</h3><p class="blurb">${esc(p.name)}: ${esc(p.does.charAt(0).toLowerCase()+p.does.slice(1))}.</p>`:''}
    <div class="acts">${ctaFor(p,a)}${sec}${ask}</div>${stepBtns(i)}`;
  /* warm the neighbours so Next is instant */
  [ORDER[i-1],ORDER[i+1]].forEach(id=>{if(id){const im=new Image();im.src=area(id).img;}});
}
let cur=null;
function select(id,{push=true,scroll=false}={}){
  const a=id&&area(id);cur=a?a.id:null;
  a?showArea(a):showWelcome();
  $$('.plan g[data-area]').forEach(g=>g.classList.toggle('on',!!cur&&g.dataset.area===cur));
  $$('.chip').forEach(c=>c.setAttribute('aria-current',c.dataset.go===cur));
  const h=cur?`#/a/${cur}`:'#/';
  if(push&&location.hash!==h)history.pushState(null,'',h);
  if(scroll&&narrow())card.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}

/* ---------- menu + info panel ---------- */
const menu=$('#menu'),panel=$('#panel'),pbody=$('#panel-body');
$('#menu-btn').onclick=()=>menu.showModal();
$$('dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target===d)d.close();});$('.x',d).onclick=()=>d.close();});
const bookHTML=D.desk.filter(d=>d.action!=='rules').map(d=>d.url?`<a class="btn ${d.inquiry==='event'?'btn-red':'btn-glass'}" href="${esc(d.url)}" rel="noopener">${esc(d.label)}</a>`:`<button class="btn btn-glass" data-open="${esc(d.action)}" data-inquiry="${esc(d.inquiry||'')}">${esc(d.label)}</button>`).join('');
$('#book').innerHTML=bookHTML;$('#menu-book').innerHTML=bookHTML;
$('#m-waiver').href=D.site.waiver;
$('#menu-foot').innerHTML=`${esc(D.site.address)}<br>${esc(D.site.city)}<br><a href="${esc(D.site.phoneHref)}">${esc(D.site.phone)}</a> · <a href="mailto:${esc(D.site.email)}">${esc(D.site.email)}</a>`;

function openPanel(kind,inq){
  if(kind==='rules'){const R=D.rules;pbody.innerHTML=`<p class="kicker">Facility rules</p><h2>Before you play</h2><p class="lede">${esc(R.intro)}</p>
    ${R.sections.map(s=>`<h3>${esc(s.title)}</h3><ul class="rules">${s.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`).join('')}
    <p class="note">Pulled ${esc(R.pulled)} from <a href="${esc(D.site.rulesSource)}" rel="noopener">boomtownathletics.com</a>. Sign the <a href="${esc(D.site.waiver)}" rel="noopener">liability waiver</a> before you play.</p>`;}
  else if(kind==='faq'){pbody.innerHTML=`<p class="kicker">Questions</p><h2>Before you come</h2>${D.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}`;}
  else if(kind==='partners'){pbody.innerHTML=`<p class="kicker">Partners</p><h2>Who runs what</h2><p class="lede">The building is shared by independent operators. Each place on the tour sends you to the right one.</p><div class="plist">${D.partners.filter(p=>p.id!=='fhusa').map(p=>isUrl(p.url)?`<a href="${esc(p.url)}" rel="noopener"><strong>${esc(p.name)}</strong><i>Visit</i><span>${esc(p.does)}</span></a>`:`<button data-open="contact" data-inquiry="${esc(p.inquiry)}"><strong>${esc(p.name)}</strong><i>Ask</i><span>${esc(p.does)}</span></button>`).join('')}</div>`;}
  else if(kind==='contact'){pbody.innerHTML=`<p class="kicker">Front desk</p><h2>Ask us</h2><p class="lede">Tell us what you want to do and it goes to the right person. Or call <a href="${esc(D.site.phoneHref)}">${esc(D.site.phone)}</a>.</p>
    <form id="inq" novalidate><label>I want to<select name="type" id="inq-type" required>${D.inquiries.map(i=>`<option value="${esc(i.id)}">${esc(i.label)}</option>`).join('')}</select></label>
    <div class="f2"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label></div>
    <div class="f2"><label>Phone<input name="phone" type="tel" autocomplete="tel"></label><label>Date, if you have one<input name="date" type="date"></label></div>
    <label>Details<textarea name="details" placeholder="Headcount, hours, sport, anything that helps us answer fast."></textarea></label>
    <div><button class="btn btn-red" type="submit">Send the request</button></div><p id="form-note">Sending opens your email app with the message filled in and addressed to the right team.</p></form>`;
    if(inq&&D.inquiries.some(i=>i.id===inq))$('#inq-type').value=inq;
    $('#inq').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const fd=new FormData(f),t=inquiry(fd.get('type'));
      const subject=`[FHUSA] ${t.label} — ${fd.get('name')}`;const body=[`Request: ${t.label}`,`Name: ${fd.get('name')}`,`Email: ${fd.get('email')}`,`Phone: ${fd.get('phone')||'-'}`,`Date: ${fd.get('date')||'-'}`,'',fd.get('details')||'',''].join('\n');
      // ponytail: mailto, no backend. Upgrade: POST to a Pages Function that emails t.to.
      location.href=`mailto:${t.to.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      $('#form-note').innerHTML=`Your email app should have opened. If it didn't, send it yourself to <strong>${esc(t.to.join(', '))}</strong>.`;});}
  else return;
  if(!panel.open)panel.showModal();$('.inner',panel).scrollTop=0;
}

/* ---------- one click handler ---------- */
document.addEventListener('click',e=>{
  const open=e.target.closest('[data-open]');
  if(open){if(menu.open)menu.close();openPanel(open.dataset.open,open.dataset.inquiry||null);return;}
  const g=e.target.closest('[data-go]');
  if(g&&g.dataset.go){select(g.dataset.go,{scroll:!g.closest('.card')});return;}
  const pg=e.target.closest('.plan g[data-area]');
  if(pg&&pg.dataset.area)select(pg.dataset.area,{scroll:true});
});
$$('.plan g[data-area]').forEach(g=>g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.dispatchEvent(new MouseEvent('click',{bubbles:true}));}}));
document.addEventListener('keydown',e=>{
  if(e.target.matches?.('input,textarea,select')||$$('dialog[open]').length)return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const i=cur?ORDER.indexOf(cur):-1,n=ORDER[i+(e.key==='ArrowRight'?1:-1)];
  if(n){e.preventDefault();select(n);}
});

/* ---------- routing: #/a/<id>; old walk-in links (#/lobby, #/w/<wing>) still land somewhere sensible ---------- */
function fromHash(){
  const h=location.hash.replace(/^#\/?/,'');let m;
  if((m=h.match(/^a\/([\w-]+)$/))&&area(m[1]))return m[1];
  if((m=h.match(/^w\/([\w-]+)$/))){const w=D.wings.find(w=>w.key===m[1]);if(w)return w.areas.find(id=>area(id).zone)||w.areas[0];}
  return null;
}
addEventListener('popstate',()=>select(fromHash(),{push:false}));
/* the panning photo needs the card width to know how far to slide */
new ResizeObserver(([e])=>photo.style.setProperty('--cw',e.contentRect.width+'px')).observe($('.photo'));
select(fromHash(),{push:false});
})();
</script>
</body>
</html>
