<style>
/* ---------- tokens ---------- */
:root{
  --black:#000;--white:#fff;--red:#ff0000;
  --glass:rgba(0,0,0,.58);--glass-2:rgba(0,0,0,.78);--line:rgba(255,255,255,.18);
  --display:'Big Shoulders Display',Impact,'Arial Narrow Bold',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --walk:820ms;
  --gutter:clamp(14px,3vw,32px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
h1,h2,h3{font-family:var(--display);font-weight:900;line-height:.92;margin:0;text-transform:uppercase}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 20px;border-radius:999px;
  font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;white-space:nowrap;
  transition:transform 160ms var(--ease-out),background-color 160ms ease,color 160ms ease,box-shadow 160ms ease}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:var(--white)}
.btn-white{background:var(--white);color:var(--black)}
.btn-glass{background:var(--glass);color:var(--white);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn-ghost{box-shadow:inset 0 0 0 2px currentColor}
@media (hover:hover) and (pointer:fine){
  .btn-red:hover{background:#e60000}.btn-white:hover{background:#ededed}
  .btn-glass:hover{background:var(--glass-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
}

/* ---------- stage: the first-person view ---------- */
#stage{position:fixed;inset:0;background:var(--black);overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden;will-change:transform,opacity,filter;transform-origin:var(--ox,50%) var(--oy,50%)}
.layer .bg{position:absolute;inset:-4%;background-size:cover;background-position:center;transform:scale(1)}
.layer .bg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.25) 38%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.55) 100%),
  radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
/* arriving: step out of a slightly larger, softer frame into focus */
.layer.enter{animation:arrive var(--walk) var(--ease-out) both}
.layer.enter.back{animation:arrive-back var(--walk) var(--ease-out) both}
/* leaving: walk forward into the frame toward where you clicked */
.layer.leave{animation:walk var(--walk) var(--ease-in-out) both;pointer-events:none}
.layer.leave.back{animation:walk-back var(--walk) var(--ease-in-out) both}
.layer.leave.left{animation:walk-left var(--walk) var(--ease-in-out) both}
.layer.leave.right{animation:walk-right var(--walk) var(--ease-in-out) both}
@keyframes walk{0%{transform:scale(1);opacity:1;filter:blur(0)}60%{opacity:1}100%{transform:scale(1.28);opacity:0;filter:blur(10px)}}
@keyframes walk-left{0%{transform:scale(1) translateX(0);opacity:1;filter:blur(0)}100%{transform:scale(1.18) translateX(9%);opacity:0;filter:blur(8px)}}
@keyframes walk-right{0%{transform:scale(1) translateX(0);opacity:1;filter:blur(0)}100%{transform:scale(1.18) translateX(-9%);opacity:0;filter:blur(8px)}}
@keyframes walk-back{0%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(.9);opacity:0;filter:blur(8px)}}
@keyframes arrive{0%{transform:scale(1.1);opacity:0;filter:blur(8px)}35%{opacity:1}100%{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes arrive-back{0%{transform:scale(.94);opacity:0;filter:blur(8px)}35%{opacity:1}100%{transform:scale(1);opacity:1;filter:blur(0)}}
/* the footsteps: a small bob on the whole view while walking */
#stage.walking{animation:bob 900ms var(--ease-in-out) both}
@keyframes bob{0%{transform:translateY(0)}25%{transform:translateY(-7px)}50%{transform:translateY(0)}75%{transform:translateY(-5px)}100%{transform:translateY(0)}}
/* slow drift so a still photo feels like standing in a room */
.layer.enter .bg{animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.06) translate(-1.2%,-.8%)}}
@media (prefers-reduced-motion:reduce){
  .layer.enter,.layer.enter.back{animation:fade-in 260ms ease both}
  .layer.leave,.layer.leave.back,.layer.leave.left,.layer.leave.right{animation:fade-out 260ms ease both}
  #stage.walking{animation:none}.layer.enter .bg{animation:none}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}@keyframes fade-out{from{opacity:1}to{opacity:0}}
}

/* ---------- exterior doors ---------- */
.doors{position:absolute;inset:0;pointer-events:none;z-index:2}
.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#0b0b0b,#161616);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  transform:translateX(0);transition:transform 700ms var(--ease-in-out)}
.door.l{left:0;border-right:2px solid rgba(255,255,255,.25)}.door.r{right:0;border-left:2px solid rgba(255,255,255,.25)}
.door::after{content:"";position:absolute;top:46%;width:10px;height:70px;border-radius:5px;background:rgba(255,255,255,.35)}
.door.l::after{right:22px}.door.r::after{left:22px}
.doors.open .door.l{transform:translateX(-101%)}.doors.open .door.r{transform:translateX(101%)}
/* doors only cover the view while you're outside; they start open so the photo shows, and shut-then-open is the step-in */
.doors{opacity:0;transition:opacity 200ms ease}
.doors.armed{opacity:1}
@media (prefers-reduced-motion:reduce){.door{transition:none}}

/* ---------- scene copy ---------- */
.copy{position:absolute;left:0;right:0;bottom:0;padding:0 var(--gutter) calc(96px + env(safe-area-inset-bottom));z-index:3;pointer-events:none}
.copy>*{pointer-events:auto}
.copy .kicker{display:inline-block;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--red);padding:4px 10px 5px;border-radius:6px;margin-bottom:8px}
.copy h1{font-size:clamp(40px,min(9vw,13vh),128px);max-width:11ch;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.copy h2{font-size:clamp(40px,6.5vw,92px);text-shadow:0 2px 24px rgba(0,0,0,.6)}
.copy .lede{max-width:52ch;font-size:clamp(17px,1.7vw,21px);color:rgba(255,255,255,.9);margin:14px 0 24px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.copy .ctas{display:flex;flex-wrap:wrap;gap:10px}
.copy .hero-logo{width:min(440px,70vw,34vh);--logo-ink:#fff;margin-bottom:18px;filter:drop-shadow(0 4px 20px rgba(0,0,0,.6))}
.copy .hero-logo svg{width:100%;height:auto;display:block}
/* stagger the copy in after arrival */
.layer.enter .copy>*{opacity:0;transform:translateY(10px);animation:up 500ms var(--ease-out) forwards}
.layer.enter .copy>:nth-child(1){animation-delay:calc(var(--walk) * .55)}.layer.enter .copy>:nth-child(2){animation-delay:calc(var(--walk) * .62)}
.layer.enter .copy>:nth-child(3){animation-delay:calc(var(--walk) * .69)}.layer.enter .copy>:nth-child(4){animation-delay:calc(var(--walk) * .76)}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.layer.enter .copy>*{animation:none;opacity:1;transform:none}}

/* ---------- markers: objective-style hotspots in the scene ---------- */
.markers{position:absolute;inset:0;z-index:3;pointer-events:none}
.marker{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;pointer-events:auto;text-decoration:none;
  opacity:0;animation:up 420ms var(--ease-out) forwards;animation-delay:calc(var(--walk) * .7 + var(--i,0) * 45ms)}
.marker .ring{position:relative;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 3px rgba(0,0,0,.45);flex:none;transition:background-color 160ms ease,transform 160ms var(--ease-out)}
.marker .ring::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(255,255,255,.75);animation:pulse 2.2s ease-out infinite}
.marker .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--red);opacity:0;transition:opacity 160ms ease}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.marker .tag{display:grid;gap:1px;padding:7px 12px 8px;border-radius:12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--line);text-align:left;
  transition:transform 180ms var(--ease-out),background-color 160ms ease,box-shadow 160ms ease}
.marker .tag b{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.marker .tag small{font-size:12.5px;color:rgba(255,255,255,.8);line-height:1.2}
@media (hover:hover) and (pointer:fine){
  .marker:hover .ring{transform:scale(1.15)}.marker:hover .ring::after{opacity:1}
  .marker:hover .tag{transform:translateX(4px);background:var(--glass-2);box-shadow:inset 0 0 0 1px rgba(255,0,0,.8)}
}
.marker:active .ring{transform:scale(.9)}
.marker.flip{flex-direction:row-reverse}
.marker.flip .tag{text-align:right}
@media (hover:hover) and (pointer:fine){.marker.flip:hover .tag{transform:translateX(-4px)}}
.marker.up{flex-direction:column}
@media (prefers-reduced-motion:reduce){.marker{animation:none;opacity:1}.marker .ring::before{animation:none;opacity:.6}}
/* small screens: markers become a rail you can scroll */
@media (max-width:760px){
  .markers{top:auto;bottom:calc(110px + env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:10px;overflow-x:auto;padding:6px var(--gutter);scroll-snap-type:x mandatory;scrollbar-width:none}
  .markers::-webkit-scrollbar{display:none}
  .marker{position:static;transform:none;scroll-snap-align:start;flex:none}
  .marker.flip{flex-direction:row}.marker.flip .tag{text-align:left}.marker.up{flex-direction:row}
  .copy{padding-bottom:calc(192px + env(safe-area-inset-bottom))}
  .copy h1{font-size:clamp(44px,13vw,80px)}
  .copy .kicker{font-size:13px;padding:3px 8px 4px}
}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) var(--gutter) 0;pointer-events:none}
.hud-top>*{pointer-events:auto}
.hud-top .logo{display:block;height:34px;width:68px;--logo-ink:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.hud-top .logo svg{height:100%;width:100%;display:block}
.hud-btns{display:flex;gap:8px}
.hud-btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--line);
  font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;transition:background-color 160ms ease,transform 160ms var(--ease-out),box-shadow 160ms ease}
.hud-btn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){.hud-btn:hover{background:var(--glass-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}}
.hud-btn .bars{width:18px;height:12px;position:relative}
.hud-btn .bars i{position:absolute;left:0;right:0;height:2px;background:currentColor;border-radius:2px}
.hud-btn .bars i:nth-child(1){top:0}.hud-btn .bars i:nth-child(2){top:5px}.hud-btn .bars i:nth-child(3){top:10px}
@media (max-width:600px){.hud-btn .lbl{display:none}.hud-btn{padding:0 12px}}

/* compass */
#compass{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--line);
  transition:opacity 250ms ease,transform 250ms var(--ease-out)}
#compass.hide{opacity:0;transform:translate(-50%,-8px);pointer-events:none}
#compass button{display:grid;gap:0;place-items:center;min-width:64px;height:36px;padding:0 12px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;line-height:1;
  transition:background-color 160ms ease,color 160ms ease,transform 160ms var(--ease-out)}
#compass button:active{transform:scale(.96)}
#compass button span{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.65);font-weight:700}
#compass button.on{background:var(--red)}#compass button.on span{color:rgba(255,255,255,.85)}
@media (hover:hover) and (pointer:fine){#compass button:not(.on):hover{background:rgba(255,255,255,.12)}}
@media (max-width:760px){#compass{top:calc(62px + env(safe-area-inset-top))}#compass button{min-width:50px;padding:0 9px;height:32px;font-size:14px}}

/* where you are + front-desk actions */
.hud-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 var(--gutter) calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.hud-bottom>*{pointer-events:auto}
#crumb{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--line);
  font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;max-width:min(60vw,520px)}
#crumb i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,0,0,.25);flex:none}
#crumb span{opacity:.6}#crumb span.here{opacity:1}
#crumb button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;margin-left:4px;border-radius:999px;background:rgba(255,255,255,.12);font-size:15px;transition:background-color 160ms ease,transform 160ms var(--ease-out)}
#crumb button:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){#crumb button:hover{background:rgba(255,255,255,.22)}}
#desk{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;transition:opacity 250ms ease,transform 250ms var(--ease-out)}
#desk.hide{opacity:0;transform:translateY(8px);pointer-events:none}
#minimap{width:150px;aspect-ratio:820/650;border-radius:10px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--line);padding:6px;cursor:pointer;
  transition:transform 180ms var(--ease-out),box-shadow 160ms ease}
#minimap:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){#minimap:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}}
#minimap svg{width:100%;height:100%;display:block}
@media (max-width:760px){
  .hud-bottom{flex-direction:column;align-items:stretch;gap:8px}
  #crumb{max-width:100%;height:36px;font-size:15px;order:2}
  #desk{order:1;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter)}
  #desk::-webkit-scrollbar{display:none}
  #desk .btn{min-height:40px;font-size:16px;padding:0 14px;flex:none}
  #minimap{position:fixed;top:calc(62px + env(safe-area-inset-top));right:var(--gutter);width:76px;padding:4px}
}
#reticle{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 2px rgba(0,0,0,.35);pointer-events:none;display:none}
@media (hover:hover) and (pointer:fine){#reticle{display:block}}

/* floor-plan drawing (shared by minimap and map dialog) */
.plan .shell{fill:none;stroke:#fff;stroke-width:3}
.plan .room{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.7);stroke-width:1.5}
.plan .court{fill:#c8742f;stroke:#fff;stroke-width:1.3}
.plan .net{stroke:#fff;stroke-width:3}
.plan .post{fill:#fff}
.plan .attack{stroke:rgba(255,255,255,.75);stroke-width:1;stroke-dasharray:4 3}
.plan text{fill:#fff;font-family:var(--body);font-weight:600;font-size:13px;pointer-events:none;text-anchor:middle}
.plan .znum{font-family:var(--display);font-weight:900;font-size:36px;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:5}
.plan .hit{fill:transparent;cursor:pointer}
.plan g[data-area].on .court{fill:var(--red)}
.plan g[data-area].on .room{fill:rgba(255,0,0,.55);stroke:#fff}
@media (hover:hover) and (pointer:fine){.plan g[data-area]:hover .court{fill:#e8893a}.plan g[data-area]:hover .room{fill:rgba(255,255,255,.18)}}
.plan .you{fill:var(--red);stroke:#fff;stroke-width:3;transition:transform 700ms var(--ease-in-out)}
.plan .cone{fill:rgba(255,0,0,.28);transition:transform 700ms var(--ease-in-out)}
.plan .aisle{display:none}.plan.mini text{display:none}.plan.mini .znum{display:block;font-size:44px}.plan.mini .attack{display:none}
.plan.mini .shell{stroke-width:4}.plan.mini .hit{cursor:default}
@media (prefers-reduced-motion:reduce){.plan .you,.plan .cone{transition:none}}

/* ---------- area detail panel ---------- */
#detail{position:absolute;left:var(--gutter);top:calc(74px + env(safe-area-inset-top));bottom:calc(74px + env(safe-area-inset-bottom));width:min(440px,92vw);z-index:4;overflow:auto;
  padding:22px 22px 24px;border-radius:18px;background:var(--glass-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--line),0 30px 60px -30px rgba(0,0,0,.9);
  transform:translateX(-24px);opacity:0;transition:transform 420ms var(--ease-out),opacity 300ms ease;pointer-events:none}
#detail.show{transform:none;opacity:1;pointer-events:auto;transition-delay:calc(var(--walk) * .5)}
#detail .kicker{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--red)}
#detail h2{font-size:clamp(40px,4.4vw,60px);margin:2px 0 4px}
#detail .courts{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:12px}
#detail .blurb{color:rgba(255,255,255,.9);margin-bottom:16px}
#detail h3{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);margin:0 0 6px}
#detail ul.what{display:grid;gap:6px;margin-bottom:18px}
#detail ul.what li{padding-left:18px;position:relative;color:rgba(255,255,255,.9)}
#detail ul.what li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;background:var(--red);transform:rotate(45deg)}
#detail .acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
#detail .nav{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
#detail .nav button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.1);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;transition:background-color 160ms ease,transform 160ms var(--ease-out)}
#detail .nav button:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){#detail .nav button:hover{background:rgba(255,255,255,.2)}}
#detail .handle{display:none}
@media (max-width:760px){
  #detail{left:0;right:0;top:auto;bottom:0;width:auto;max-height:66svh;border-radius:18px 18px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform 360ms var(--ease-drawer),opacity 200ms ease;touch-action:pan-y}
  #detail.show{transform:none}
  #detail.dragging{transition:none}
  #detail .handle{display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:2px auto 12px;touch-action:none}
  #detail h2{font-size:38px}
}
@media (prefers-reduced-motion:reduce){#detail{transition:opacity 200ms ease;transform:none}}

/* ---------- dialogs: menu, map, panel ---------- */
dialog{color:var(--white);border:0;padding:0;max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:var(--gutter);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:26px;line-height:1;background:rgba(255,255,255,.1);transition:background-color 160ms ease,transform 160ms var(--ease-out);z-index:2}
dialog .x:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){dialog .x:hover{background:rgba(255,255,255,.2)}}

#menu{position:fixed;inset:0;left:auto;width:min(480px,100vw);height:100%;margin:0;background:var(--black);
  transform:translateX(100%);transition:transform 340ms var(--ease-drawer),display 340ms allow-discrete,overlay 340ms allow-discrete}
#menu[open]{transform:none}
@starting-style{#menu[open]{transform:translateX(100%)}}
#menu::backdrop{opacity:0;transition:opacity 340ms ease,display 340ms allow-discrete,overlay 340ms allow-discrete}
#menu[open]::backdrop{opacity:1}
@starting-style{#menu[open]::backdrop{opacity:0}}
#menu .inner{height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) var(--gutter) 40px;display:flex;flex-direction:column}
#menu .mlogo{height:30px;--logo-ink:#fff;margin:6px 0 14px}
#menu .mlogo svg{height:100%;width:auto}
#menu h2{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.08em;color:rgba(255,255,255,.5);margin:22px 0 6px;text-transform:uppercase}
#menu .go{display:grid;gap:2px}
#menu .go button{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0;text-align:left;
  font-family:var(--display);font-weight:900;font-size:clamp(38px,6vw,50px);line-height:1;text-transform:uppercase;transition:color 160ms ease,transform 160ms var(--ease-out)}
#menu .go button:active{transform:scale(.985)}#menu .go button small{font-family:var(--body);font-weight:500;font-size:14px;text-transform:none;color:rgba(255,255,255,.6)}
#menu .go button.here{color:var(--red)}
@media (hover:hover) and (pointer:fine){#menu .go button:hover{color:var(--red)}}
#menu .areas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#menu .areas button{display:grid;gap:1px;text-align:left;padding:9px 11px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:background-color 160ms ease,transform 160ms var(--ease-out)}
#menu .areas button:active{transform:scale(.97)}
#menu .areas button.here{box-shadow:inset 0 0 0 2px var(--red)}
@media (hover:hover) and (pointer:fine){#menu .areas button:hover{background:rgba(255,255,255,.1)}}
#menu .areas b{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
#menu .areas small{font-size:12px;color:rgba(255,255,255,.65)}
#menu .row{display:flex;flex-wrap:wrap;gap:8px}
#menu .foot{margin-top:auto;padding-top:24px;color:rgba(255,255,255,.65);font-size:15px;line-height:1.6}
#menu .foot a{color:#fff;text-decoration:none;font-weight:600}
#menu .st{opacity:0;transform:translateY(10px);transition:opacity 300ms ease,transform 420ms var(--ease-out)}
#menu[open] .st{opacity:1;transform:none}
#menu[open] .st:nth-child(2){transition-delay:60ms}#menu[open] .st:nth-child(3){transition-delay:100ms}#menu[open] .st:nth-child(4){transition-delay:140ms}
#menu[open] .st:nth-child(5){transition-delay:180ms}#menu[open] .st:nth-child(6){transition-delay:220ms}#menu[open] .st:nth-child(7){transition-delay:260ms}#menu[open] .st:nth-child(8){transition-delay:300ms}

#map{position:fixed;inset:0;width:100%;height:100%;margin:0;background:rgba(0,0,0,.92);opacity:0;transform:scale(.97);transition:opacity 260ms ease,transform 320ms var(--ease-out),display 320ms allow-discrete,overlay 320ms allow-discrete}
#map[open]{opacity:1;transform:none}
@starting-style{#map[open]{opacity:0;transform:scale(.97)}}
#map .inner{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:calc(14px + env(safe-area-inset-top)) var(--gutter) calc(14px + env(safe-area-inset-bottom))}
#map .head{display:flex;align-items:end;gap:16px 28px;flex-wrap:wrap;padding-right:60px}
#map h2{font-size:clamp(40px,6vw,80px)}
#map .head p{color:rgba(255,255,255,.75);max-width:44ch}
#map .planwrap{min-height:0;display:grid;place-items:center}
#map .planwrap svg{width:min(100%,calc((100svh - 200px) * 820 / 650));height:auto;max-height:calc(100svh - 200px)}
#map .legend{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:8px;font-size:14px;color:rgba(255,255,255,.75)}
#map .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}

#panel{position:fixed;inset:0;left:auto;width:min(600px,100vw);height:100%;margin:0;background:#0a0a0a;
  transform:translateX(100%);transition:transform 340ms var(--ease-drawer),display 340ms allow-discrete,overlay 340ms allow-discrete}
#panel[open]{transform:none}
@starting-style{#panel[open]{transform:translateX(100%)}}
#panel .inner{height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) var(--gutter) 48px}
#panel .kicker{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--red);margin-top:6px}
#panel h2{font-size:clamp(40px,5vw,64px);margin-bottom:12px;padding-right:56px}
#panel .lede{color:rgba(255,255,255,.8);max-width:60ch;margin-bottom:22px}
#panel h3{font-size:24px;margin:22px 0 8px;letter-spacing:.02em}
#panel ul.rules li{position:relative;padding:8px 0 8px 20px;border-top:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.9);max-width:62ch}
#panel ul.rules li::before{content:"";position:absolute;left:0;top:1.05em;width:8px;height:8px;background:var(--red);transform:rotate(45deg)}
#panel details{border-top:1px solid rgba(255,255,255,.12)}
#panel details:last-of-type{border-bottom:1px solid rgba(255,255,255,.12)}
#panel summary{list-style:none;cursor:pointer;padding:14px 40px 14px 0;position:relative;font-weight:600;font-size:17px}
#panel summary::-webkit-details-marker{display:none}
#panel summary::after{content:"";position:absolute;right:8px;top:50%;width:11px;height:11px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-70%) rotate(45deg);transition:transform 200ms var(--ease-out)}
#panel details[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
#panel details p{padding:0 0 16px;max-width:60ch;color:rgba(255,255,255,.8)}
#panel .plist a,#panel .plist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;width:100%;text-align:left;padding:12px 0;border-top:1px solid rgba(255,255,255,.12);text-decoration:none;transition:padding-left 200ms var(--ease-out)}
#panel .plist strong{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
#panel .plist span{grid-column:1;color:rgba(255,255,255,.7);font-size:15px}
#panel .plist i{grid-row:1/3;font-style:normal;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--red)}
@media (hover:hover) and (pointer:fine){#panel .plist a:hover,#panel .plist button:hover{padding-left:8px}}
#panel .note{font-size:14px;color:rgba(255,255,255,.55);margin-top:24px}
#panel .note a{color:#fff}
form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
input,select,textarea{font:inherit;color:#fff;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.3);border-radius:8px;padding:11px 13px;min-height:46px;width:100%}
select option{color:#000}
textarea{min-height:120px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#form-note{color:rgba(255,255,255,.7);font-size:14px}
@media (max-width:560px){.f2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#menu,#menu::backdrop,#menu .st,#map,#panel{transition:none}}

/* loading / error */
#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--black);transition:opacity 400ms ease;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6)}
#boot.off{opacity:0;pointer-events:none}
</style>

    <div class="head"><h2>Floor plan</h2><p>Tap any zone or room to walk there. The red dot is you.</p></div>
    <div class="planwrap" id="mapwrap"></div>
    <div class="legend"><span><i style="background:#c8742f"></i>Volleyball court</span><span><i style="background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px #fff"></i>Room</span><span><i style="background:#ff0000"></i>Where you are</span></div>
  </div>
</dialog>

<dialog id="panel" aria-label="Information">
  <div class="inner"><button class="x" aria-label="Close">×</button><div id="panel-body"></div></div>
</dialog>

<script src="assets/plan.js"></script>
<script>
(async function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile=()=>matchMedia('(max-width: 760px)').matches;
const WALK=reduce?260:820;
const stage=$('#stage'),boot=$('#boot');

let D;
try{const r=await fetch('data/zones.json');if(!r.ok)throw 0;D=await r.json();}
catch(e){boot.textContent='The building data did not load. Refresh, or call 720-773-4776.';return;}

const area=id=>D.areas.find(a=>a.id===id);
const wing=k=>D.wings.find(w=>w.key===k);
const partner=id=>D.partners.find(p=>p.id===id);
const inquiry=id=>D.inquiries.find(i=>i.id===id)||D.inquiries[D.inquiries.length-1];
const isUrl=u=>/^https?:/.test(u||'');

/* ---------- floor plan: shared geometry in assets/plan.js ---------- */
const {ROOMS,ZONES,areaPos}=FHPLAN;
const POS={ // where you stand on the plan, and which way you face (deg; 0 = facing down the aisle)
  exterior:[418,8,0],lobby:[418,120,0],west:[300,170,100],ahead:[418,330,0],east:[560,120,-100]
};
const planSVG=mini=>FHPLAN.svg({mini,areas:D.areas});
function placeYou(svg,p){
  const yg=$('.youg',svg);if(!yg)return;
  $('.you',yg).style.transform=`translate(${p[0]}px,${p[1]}px)`;
  $('.cone',yg).style.transform=`translate(${p[0]}px,${p[1]}px) rotate(${p[2]}deg)`;
}
function markPlan(svg,areaId){$$('g[data-area]',svg).forEach(g=>g.classList.toggle('on',!!areaId&&g.dataset.area===areaId));}

/* ---------- scenes ---------- */
const state={kind:'exterior',key:null,layer:null};
let walking=false;
function sceneImg(kind,key){
  if(kind==='exterior')return D.exterior.img;
  if(kind==='lobby')return D.lobby.img;
  if(kind==='wing')return wing(key).img;
  return area(key).img;
}
function copyHTML(kind,key){
  if(kind==='exterior')return `<div class="copy"><div class="hero-logo"><svg role="img" aria-label="FieldhouseUSA"><use href="#logo"/></svg></div>
    <h1>${esc(D.exterior.title)}</h1><p class="lede">${esc(D.exterior.lede)}</p>
    <div class="ctas"><button class="btn btn-red" data-go="lobby">Walk in</button><a class="btn btn-glass" href="site.html">Browse the site instead</a></div></div>`;
  if(kind==='lobby')return `<div class="copy"><p class="kicker">Front desk</p><h2>${esc(D.lobby.title)}</h2><p class="lede">${esc(D.lobby.sub)}</p></div>`;
  if(kind==='wing'){const w=wing(key);return `<div class="copy"><p class="kicker">${esc(w.sub)}</p><h2>${esc(w.name)}</h2></div>`;}
  return '';
}
function markersHTML(kind,key){
  if(kind==='lobby'){
    const pos={west:[16,55,'flip'],ahead:[50,47,'up'],east:[84,55,'']};
    return `<div class="markers">${D.wings.map((w,i)=>{const p=pos[w.key];return `<button class="marker ${p[2]}" style="left:${p[0]}%;top:${p[1]}%;--i:${i}" data-go="wing" data-key="${w.key}" data-dir="${w.dir}">
      <span class="ring"></span><span class="tag"><b>${esc(w.arrow)} ${esc(w.name)}</b><small>${esc(w.sub)}</small></span></button>`;}).join('')}</div>`;
  }
  if(kind==='wing'){
    const w=wing(key),n=w.areas.length;
    return `<div class="markers">${w.areas.map((id,i)=>{const a=area(id);const x=n===1?50:12+i*(76/(n-1)),y=i%2?60:44;const flip=x>60?'flip':'';
      return `<button class="marker ${flip}" style="left:${x}%;top:${y}%;--i:${i}" data-go="area" data-key="${id}">
      <span class="ring"></span><span class="tag"><b>${esc(a.name)}</b><small>${esc(a.courts||a.tag)}</small></span></button>`;}).join('')}</div>`;
  }
  return '';
}
function buildLayer(kind,key){
  const l=document.createElement('div');l.className='layer';
  l.innerHTML=`<div class="bg" style="background-image:url('${esc(sceneImg(kind,key))}')"></div>${markersHTML(kind,key)}${copyHTML(kind,key)}`;
  if(kind==='exterior')l.insertAdjacentHTML('beforeend','<div class="doors"><div class="door l"></div><div class="door r"></div></div>');
  return l;
}
function preload(src){const i=new Image();i.src=src;}
function preloadFor(kind,key){
  if(kind==='exterior')preload(D.lobby.img);
  if(kind==='lobby')D.wings.forEach(w=>preload(w.img));
  if(kind==='wing')wing(key).areas.forEach(id=>preload(area(id).img));
  if(kind==='area')preload(wing(area(key).wing).img);
}

/* walk from the current scene into the next one */
function go(kind,key,opts={}){
  if(walking)return;
  if(state.kind===kind&&state.key===key)return;
  const dir=opts.dir||'ahead',back=!!opts.back;
  const next=buildLayer(kind,key);
  const old=state.layer;
  walking=true;
  if(old){
    if(opts.ox!=null){old.style.setProperty('--ox',opts.ox+'%');old.style.setProperty('--oy',opts.oy+'%');}
    old.classList.remove('enter');old.classList.add('leave');
    if(back)old.classList.add('back');else if(dir==='left')old.classList.add('left');else if(dir==='right')old.classList.add('right');
    $$('.marker',old).forEach(m=>m.style.opacity=0);
  }
  next.classList.add('enter');if(back)next.classList.add('back');
  stage.appendChild(next);
  if(!reduce){stage.classList.remove('walking');void stage.offsetWidth;stage.classList.add('walking');}
  state.kind=kind;state.key=key;state.layer=next;
  setTimeout(()=>{if(old)old.remove();walking=false;stage.classList.remove('walking');},WALK+40);
  hud();preloadFor(kind,key);
  const h=kind==='exterior'?'#/':kind==='lobby'?'#/lobby':kind==='wing'?`#/w/${key}`:`#/a/${key}`;
  if(location.hash!==h)history.pushState(null,'',h);
}
function back(){
  if(state.kind==='area')go('wing',area(state.key).wing,{back:true});
  else if(state.kind==='wing')go('lobby',null,{back:true});
  else if(state.kind==='lobby')go('exterior',null,{back:true});
}
/* step in: the doors close over the view, then part as you walk through */
function stepInside(){
  const doors=$('.doors',state.layer);
  if(doors&&!reduce){
    doors.classList.add('armed');
    setTimeout(()=>{doors.classList.add('open');setTimeout(()=>go('lobby'),380);},260);
  }else go('lobby');
}

/* ---------- HUD ---------- */
const crumb=$('#crumb'),compass=$('#compass'),desk=$('#desk'),detail=$('#detail'),dbody=$('#detail-body'),mini=$('#minimap');
mini.innerHTML=planSVG(true);
$('#map .planwrap').innerHTML=planSVG(false);
function hud(){
  const k=state.kind,key=state.key;
  let parts=[];
  if(k==='exterior')parts=['Outside'];
  else if(k==='lobby')parts=['Lobby'];
  else if(k==='wing')parts=['Lobby',wing(key).name];
  else{const a=area(key);parts=['Lobby',wing(a.wing).name,a.name];}
  crumb.innerHTML='<i></i>'+parts.map((p,i)=>`<span class="${i===parts.length-1?'here':''}">${esc(p)}</span>`).join('<span>›</span>')+(k!=='exterior'?'<button data-back aria-label="Go back">← Back</button>':'');
  const curWing=k==='wing'?key:k==='area'?area(key).wing:null;
  compass.classList.toggle('hide',k==='exterior');
  compass.innerHTML=D.wings.map(w=>`<button class="${w.key===curWing?'on':''}" data-turn="${w.key}" aria-pressed="${w.key===curWing}"><span>${w.key==='west'?'W':w.key==='east'?'E':'N'}</span>${esc(w.key==='ahead'?'Ahead':w.key)}</button>`).join('');
  desk.classList.toggle('hide',k!=='lobby');
  if(k==='lobby')desk.innerHTML=D.desk.map(d=>d.url?`<a class="btn ${d.inquiry==='event'?'btn-red':'btn-glass'}" href="${esc(d.url)}" rel="noopener">${esc(d.label)}</a>`:`<button class="btn btn-glass" data-open="${d.action}" ${d.inquiry?`data-inquiry="${d.inquiry}"`:''}>${esc(d.label)}</button>`).join('');
  const pos=k==='area'?areaPos(area(key)):POS[k==='wing'?key:k];
  [$('svg',mini),$('#map svg')].forEach(svg=>{placeYou(svg,pos);markPlan(svg,k==='area'?key:null);});
  if(k==='area'){renderDetail(area(key));detail.classList.add('show');}
  else detail.classList.remove('show');
  $$('#menu [data-go]').forEach(b=>b.classList.toggle('here',(b.dataset.go===k&&(b.dataset.key||null)===(key||null))));
}
function ctaFor(p,a){
  if(!p)return '';
  if(isUrl(p.url))return `<a class="btn btn-red" href="${esc(p.url)}" rel="noopener">${esc(p.name)}</a>`;
  return `<button class="btn btn-red" data-open="contact" data-inquiry="${esc(a.inquiry)}">Ask the front desk</button>`;
}
function renderDetail(a){
  const w=wing(a.wing),p=partner(a.partner);
  const sec=a.secondary?(a.secondary.url?`<a class="btn btn-glass" href="${esc(a.secondary.url)}" rel="noopener">${esc(a.secondary.label)}</a>`:`<button class="btn btn-glass" data-open="contact" data-inquiry="${esc(a.secondary.inquiry||a.inquiry)}">${esc(a.secondary.label)}</button>`):'';
  const ask=isUrl(p&&p.url)?`<button class="btn btn-glass" data-open="contact" data-inquiry="${esc(a.inquiry)}">Ask the front desk</button>`:'';
  const idx=w.areas.indexOf(a.id),prev=w.areas[idx-1],next=w.areas[idx+1];
  dbody.innerHTML=`<p class="kicker">${esc(w.name)} · ${esc(a.tag)}</p><h2>${esc(a.name)}</h2>${a.courts?`<p class="courts">${esc(a.courts)}</p>`:''}
    <p class="blurb">${esc(a.blurb)}</p><h3>What's here</h3><ul class="what">${a.what.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${p&&p.id!=='fhusa'?`<h3>Who runs it</h3><p class="blurb">${esc(p.name)}: ${esc(p.does.charAt(0).toLowerCase()+p.does.slice(1))}.</p>`:''}
    <div class="acts">${ctaFor(p,a)}${sec}${ask}</div>
    <div class="nav">${prev?`<button data-go="area" data-key="${prev}" data-dir="left">← ${esc(area(prev).name)}</button>`:''}${next?`<button data-go="area" data-key="${next}" data-dir="right">${esc(area(next).name)} →</button>`:''}<button data-back>Back to ${esc(w.name)}</button></div>`;
}
/* phone: drag the sheet handle down to step back out */
(function(){const h=$('.handle',detail);let y0=0,t0=0,dy=0,drag=false;
  h.addEventListener('pointerdown',e=>{drag=true;y0=e.clientY;t0=performance.now();dy=0;detail.classList.add('dragging');h.setPointerCapture(e.pointerId);});
  h.addEventListener('pointermove',e=>{if(!drag)return;dy=Math.max(0,e.clientY-y0);detail.style.transform=`translateY(${dy}px)`;});
  const end=()=>{if(!drag)return;drag=false;detail.classList.remove('dragging');detail.style.transform='';const v=dy/(performance.now()-t0);if(dy>90||v>0.11)back();};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);})();

/* ---------- dialogs ---------- */
const menu=$('#menu'),map=$('#map'),panel=$('#panel'),pbody=$('#panel-body');
$('#menu-btn').onclick=()=>menu.showModal();$('#menu-x').onclick=()=>menu.close();
$$('dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target===d)d.close();});$('.x',d).onclick=()=>d.close();});
$('#minimap').onclick=()=>map.showModal();
$('#menu-go').innerHTML=`<button data-go="lobby"><span>Lobby</span><small>front desk</small></button>`+D.wings.map(w=>`<button data-go="wing" data-key="${w.key}"><span>${esc(w.arrow)} ${esc(w.name)}</span><small>${w.areas.length} areas</small></button>`).join('');
$('#menu-areas').innerHTML=D.areas.map(a=>`<button data-go="area" data-key="${a.id}"><b>${esc(a.name)}</b><small>${esc(a.courts||a.tag)}</small></button>`).join('');
$('#menu-book').innerHTML=D.desk.filter(d=>d.action!=='rules').map(d=>d.url?`<a class="btn ${d.inquiry==='event'?'btn-red':'btn-glass'}" href="${esc(d.url)}" rel="noopener">${esc(d.label)}</a>`:`<button class="btn btn-glass" data-open="${d.action}" data-inquiry="${d.inquiry||''}">${esc(d.label)}</button>`).join('');
$('#m-waiver').href=D.site.waiver;
$('#menu-foot').innerHTML=`${esc(D.site.address)}<br>${esc(D.site.city)}<br><a href="${D.site.phoneHref}">${esc(D.site.phone)}</a> · <a href="mailto:${esc(D.site.email)}">${esc(D.site.email)}</a>`;

function openPanel(kind,inq){
  if(kind==='rules'){const R=D.rules;pbody.innerHTML=`<p class="kicker">Facility rules</p><h2>Before you play</h2><p class="lede">${esc(R.intro)}</p>
    ${R.sections.map(s=>`<h3>${esc(s.title)}</h3><ul class="rules">${s.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`).join('')}
    <p class="note">Pulled ${esc(R.pulled)} from <a href="${esc(D.site.rulesSource)}" rel="noopener">boomtownathletics.com</a>. Sign the <a href="${esc(D.site.waiver)}" rel="noopener">liability waiver</a> before you play.</p>`;}
  else if(kind==='faq'){pbody.innerHTML=`<p class="kicker">Questions</p><h2>Before you come</h2>${D.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}`;}
  else if(kind==='partners'){pbody.innerHTML=`<p class="kicker">Partners</p><h2>Who runs what</h2><p class="lede">The building is shared by independent operators. Each area sends you to the right one.</p><div class="plist">${D.partners.filter(p=>p.id!=='fhusa').map(p=>isUrl(p.url)?`<a href="${esc(p.url)}" rel="noopener"><strong>${esc(p.name)}</strong><i>Visit</i><span>${esc(p.does)}</span></a>`:`<button data-open="contact" data-inquiry="${p.inquiry}"><strong>${esc(p.name)}</strong><i>Ask</i><span>${esc(p.does)}</span></button>`).join('')}</div>`;}
  else if(kind==='contact'){pbody.innerHTML=`<p class="kicker">Front desk</p><h2>Ask us</h2><p class="lede">Tell us what you want to do and it goes to the right person. Or call <a href="${D.site.phoneHref}">${esc(D.site.phone)}</a>.</p>
    <form id="inq" novalidate><label>I want to<select name="type" id="inq-type" required>${D.inquiries.map(i=>`<option value="${i.id}">${esc(i.label)}</option>`).join('')}</select></label>
    <div class="f2"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label></div>
    <div class="f2"><label>Phone<input name="phone" type="tel" autocomplete="tel"></label><label>Date, if you have one<input name="date" type="date"></label></div>
    <label>Details<textarea name="details" placeholder="Headcount, hours, sport, anything that helps us answer fast."></textarea></label>
    <div><button class="btn btn-red" type="submit">Send the request</button></div><p id="form-note">Sending opens your email app with the message filled in and addressed to the right team.</p></form>`;
    if(inq&&D.inquiries.some(i=>i.id===inq))$('#inq-type').value=inq;
    $('#inq').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const fd=new FormData(f),t=inquiry(fd.get('type'));
      const subject=`[FHUSA] ${t.label} — ${fd.get('name')}`;const body=[`Request: ${t.label}`,`Name: ${fd.get('name')}`,`Email: ${fd.get('email')}`,`Phone: ${fd.get('phone')||'-'}`,`Date: ${fd.get('date')||'-'}`,'',fd.get('details')||'',''].join('\n');
      // ponytail: mailto, no backend. Upgrade: POST to a Pages Function that emails t.to.
      location.href=`mailto:${t.to.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      $('#form-note').innerHTML=`Your email app should have opened. If it didn't, send it yourself to <strong>${esc(t.to.join(', '))}</strong>.`;});}
  else return;
  if(!panel.open)panel.showModal();$('.inner',panel).scrollTop=0;
}

/* ---------- one click handler for the whole page ---------- */
document.addEventListener('click',e=>{
  const open=e.target.closest('[data-open]');
  if(open){const k=open.dataset.open;if(menu.open)menu.close();if(k==='map')map.showModal();else openPanel(k,open.dataset.inquiry||null);return;}
  if(e.target.closest('[data-back]')){back();return;}
  const turn=e.target.closest('[data-turn]');
  if(turn){const k=turn.dataset.turn;const cur=state.kind==='wing'?state.key:state.kind==='area'?area(state.key).wing:null;
    if(k===cur){if(state.kind==='area')back();return;}
    const order=['west','ahead','east'];const dir=order.indexOf(k)<order.indexOf(cur||'ahead')?'left':'right';go('wing',k,{dir});return;}
  const g=e.target.closest('[data-go]');
  if(g){
    const kind=g.dataset.go,key=g.dataset.key||null;
    if(menu.open)menu.close();if(map.open)map.close();if(panel.open)panel.close();
    if(kind==='lobby'&&state.kind==='exterior'){stepInside();return;}
    const r=g.getBoundingClientRect();const ox=((r.left+r.width/2)/innerWidth*100),oy=((r.top+r.height/2)/innerHeight*100);
    const isBack=(kind==='lobby'&&state.kind!=='exterior')||(kind==='wing'&&state.kind==='area'&&area(state.key).wing===key);
    go(kind,key,{dir:g.dataset.dir||'ahead',ox:g.closest('.marker')?ox:50,oy:g.closest('.marker')?oy:50,back:isBack});return;
  }
  const pg=e.target.closest('.plan:not(.mini) g[data-area]');
  if(pg&&pg.dataset.area){if(map.open)map.close();go('area',pg.dataset.area);}
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if($$('dialog[open]').length)return;
  if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();back();return;}
  if(state.kind==='exterior'&&(e.key==='Enter'||e.key==='ArrowUp')){stepInside();return;}
  if(state.kind==='lobby'){if(e.key==='ArrowLeft')go('wing','west',{dir:'left'});if(e.key==='ArrowRight')go('wing','east',{dir:'right'});if(e.key==='ArrowUp')go('wing','ahead');}
  else if(state.kind==='wing'||state.kind==='area'){
    const w=wing(state.kind==='wing'?state.key:area(state.key).wing);
    if(state.kind==='wing'&&e.key==='ArrowUp'){go('area',w.areas[0]);return;}
    if(state.kind==='area'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const i=w.areas.indexOf(state.key);const n=w.areas[i+(e.key==='ArrowRight'?1:-1)];if(n)go('area',n,{dir:e.key==='ArrowRight'?'right':'left'});}
    if(state.kind==='wing'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const order=['west','ahead','east'];const i=order.indexOf(state.key)+(e.key==='ArrowRight'?1:-1);if(order[i])go('wing',order[i],{dir:e.key==='ArrowRight'?'right':'left'});}
  }
});
$$('#map .plan g[data-area]').forEach(g=>g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.click();}}));

/* ---------- routing ---------- */
function fromHash(){
  const h=location.hash.replace(/^#\/?/,'');
  if(!h)return ['exterior',null];
  if(h==='lobby')return ['lobby',null];
  const m=h.match(/^(w|a)\/([\w-]+)$/);
  if(m&&m[1]==='w'&&wing(m[2]))return ['wing',m[2]];
  if(m&&m[1]==='a'&&area(m[2]))return ['area',m[2]];
  return ['exterior',null];
}
addEventListener('popstate',()=>{const [k,key]=fromHash();if(k!==state.kind||key!==state.key)go(k,key,{back:true});});
const [k0,key0]=fromHash();
const first=buildLayer(k0,key0);first.classList.add('enter');stage.appendChild(first);state.kind=k0;state.key=key0;state.layer=first;
hud();preloadFor(k0,key0);
const img=new Image();img.src=sceneImg(k0,key0);
const off=()=>boot.classList.add('off');img.decode?img.decode().then(off,off):off();setTimeout(off,2500);
})();
</script>
</body>
</html>
